name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to resend release notes for (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release-branch:
    name: Release (branch)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.head_ref, 'release/v')
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        id: release
        run: |
          VERSION="${{ github.head_ref }}"
          VERSION="${VERSION#release/}"

          NOTES_FILE=$(mktemp)
          RELEASE_BRANCH="${{ github.head_ref }}" .github/scripts/release-notes.sh > "$NOTES_FILE"

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file "$NOTES_FILE"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  patch-release:
    name: Release (patch)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' &&
      !contains(github.event.head_commit.message, 'release/v')
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch and create release
        id: release
        run: |
          git fetch --tags
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          if [ -z "$LATEST" ]; then
            VERSION="v0.0.1"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          NOTES_FILE=$(mktemp)
          .github/scripts/release-notes.sh > "$NOTES_FILE"

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file "$NOTES_FILE"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Email release notes
    runs-on: ubuntu-latest
    needs: [release-branch, patch-release]
    if: >-
      always() &&
      (needs.release-branch.result == 'success' || needs.patch-release.result == 'success')
    steps:
      - name: Resolve version
        id: version
        run: |
          if [ "${{ needs.release-branch.result }}" == "success" ]; then
            echo "version=${{ needs.release-branch.outputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ needs.patch-release.outputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Fetch release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES=$(gh api repos/${{ github.repository }}/releases/tags/$VERSION --jq '.body')
          URL="https://github.com/${{ github.repository }}/releases/tag/$VERSION"
          {
            echo "body<<EOF"
            echo "Juno $VERSION has been released to https://junomidwives.co.uk and will be live within a few minutes."
            echo
            echo "$NOTES"
            echo
            echo "Full release notes: $URL"
            echo "EOF"
          } >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Juno ${{ steps.version.outputs.version }} released"
          to: ${{ vars.RELEASE_RECIPIENTS }}
          from: Juno <${{ secrets.MAIL_USERNAME }}>
          body: ${{ steps.notes.outputs.body }}
          html_body: ${{ steps.notes.outputs.body }}
          convert_markdown: true

  notify-manual:
    name: Email release notes (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Fetch release notes
        id: notes
        run: |
          VERSION="${{ inputs.version }}"
          NOTES=$(gh api repos/${{ github.repository }}/releases/tags/$VERSION --jq '.body')
          URL="https://github.com/${{ github.repository }}/releases/tag/$VERSION"
          {
            echo "body<<EOF"
            echo "Juno $VERSION has been released to https://junomidwives.co.uk and will be live within a few minutes."
            echo
            echo "$NOTES"
            echo
            echo "Full release notes: $URL"
            echo "EOF"
          } >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Juno ${{ inputs.version }} released"
          to: ${{ vars.RELEASE_RECIPIENTS }}
          from: Juno <${{ secrets.MAIL_USERNAME }}>
          body: ${{ steps.notes.outputs.body }}
          html_body: ${{ steps.notes.outputs.body }}
          convert_markdown: true
